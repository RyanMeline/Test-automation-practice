name: Run Tests
on:
  push:
    branches: ['**']

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go Setup
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run Tests
        run: go test -v ./...

